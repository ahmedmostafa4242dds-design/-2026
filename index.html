
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصة راعوث | كرنفال كلك زوق 2026</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f5f3ee;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}
header {
  background: #142b65;
  color: white;
  padding: 24px 12px;
}
h1 { margin: 0 0 8px; }
header p { margin: 0; }
main {
  max-width: 850px;
  margin: 20px auto;
  padding: 0 12px;
}
.page {
  background: white;
  margin-bottom: 22px;
  padding: 8px;
  border-radius: 8px;
  box-shadow: 0 2px 10px #0002;
}
.page img {
  display: block;
  width: 100%;
  height: auto;
}
footer {
  padding: 20px;
  color: #555;
}
</style>
</head>
<body>
<header>
<h1>قصة راعوث</h1>
<p>كرنفال كلك زوق 2026</p>
<p>بوابة الزمن</p>
</header>
<main id="pages"></main>
<footer>قلبك بيان في تصرفاتك</footer>
<script>
const pages = document.getElementById("pages");
for (let i = 1; i <= 6; i++) {
  const section = document.createElement("section");
  section.className = "page";
  const img = document.createElement("img");
  img.src = "images/" + i + ".jpg";
  img.alt = "صفحة " + i + " من قصة راعوث";
  img.loading = i === 1 ? "eager" : "lazy";
  section.appendChild(img);
  pages.appendChild(section);
}
</script>
</body>
</html>
